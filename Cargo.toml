[package]
name = "adtech-classifier"
version = "0.1.0"
edition = "2021"
description = "IAB taxonomy classifier built on the agnosticeng/lisa crates"

[[bin]]
name = "classify"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lisa-engine = { git = "https://github.com/agnosticeng/lisa" }
